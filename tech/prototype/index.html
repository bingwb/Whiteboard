<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイホーム家計簿 Canvas直描版</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #243247;
            background: #f3f6fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        * { box-sizing: border-box; }
        body { min-width: 320px; min-height: 100vh; margin: 0; background: radial-gradient(ellipse at 50% -20%, #e8f0ff 0, transparent 48%), #f3f6fb; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px max(24px, calc((100vw - 1280px) / 2)); background: rgba(255,255,255,.9); border-bottom: 1px solid #e5eaf2; box-shadow: 0 4px 18px rgba(31, 51, 82, .04); }
        h1 { margin: 0; color: #17243b; font-size: clamp(17px, 2vw, 21px); letter-spacing: -.03em; }
        .month-badge { flex: 0 0 auto; padding: 8px 14px; border: 1px solid #dce7fa; border-radius: 999px; background: #f0f5ff; color: #41629a; font-size: 13px; font-weight: 700; }
        main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 48px; }
        .panel { min-width: 0; padding: clamp(20px, 2.5vw, 30px); border: 1px solid #e5eaf2; border-radius: 20px; background: #fff; box-shadow: 0 12px 32px rgba(31, 51, 82, .06); }
        .panel-title { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; padding-bottom: 15px; border-bottom: 1px solid #edf1f7; color: #263650; font-size: 16px; font-weight: 750; }
        .panel-title::before { width: 4px; height: 18px; border-radius: 4px; background: #5681d8; content: ""; }
        .grid-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
        .card { min-width: 0; padding: 17px 12px; border: 1px solid #e8edf5; border-radius: 14px; background: #f8faff; text-align: center; }
        .card-title { display: block; margin-bottom: 7px; color: #6b7890; font-size: 12px; font-weight: 600; }
        .card-val { display: block; overflow-wrap: anywhere; font-size: clamp(16px, 2vw, 21px); font-weight: 800; letter-spacing: -.035em; }
        .income-value { color: #2874c8; }
        .expense-value { color: #d34d55; }
        .balance-value { color: #23956a; }
        .charts-grid { text-align: center; }
        .chart-box-title { display: block; margin-bottom: 14px; color: #64748b; font-size: 13px; font-weight: 700; }
        canvas { display: block; width: 100%; height: auto; }
        .legend { display: flex; justify-content: center; gap: 12px 16px; margin-top: 26px; color: #526179; font-size: 12px; font-weight: 550; flex-wrap: wrap; }
        .legend-box { display: inline-block; width: 11px; height: 11px; margin-right: 5px; border-radius: 3px; vertical-align: -1px; }
        @media (max-width: 640px) {
            header { padding: 14px 18px; }
            main { padding: 20px 16px 32px; }
            .panel { padding: 20px; border-radius: 16px; }
            .grid-cards { grid-template-columns: 1fr; gap: 9px; margin-bottom: 24px; }
            .card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; text-align: left; }
            .card-title { margin: 0; }
            .card-val { font-size: 18px; }
        }
        @media (max-width: 420px) {
            header { align-items: flex-start; flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📊 マイホーム家計簿 (Canvas直描版)</h1>
        <div class="month-badge">
            2026年 10月
        </div>
    </header>

    <main>
        <section class="panel" aria-labelledby="dashboard-title">
            <h2 class="panel-title" id="dashboard-title">家計簿ダッシュボード</h2>

            <div class="grid-cards">
                <div class="card"><span class="card-title">今月の収入</span><span class="card-val income-value" id="lbl-inc"></span></div>
                <div class="card"><span class="card-title">今月の支出</span><span class="card-val expense-value" id="lbl-exp">¥280,000</span></div>
                <div class="card"><span class="card-title">今月の収支</span><span class="card-val balance-value" id="lbl-bal">+¥70,000</span></div>
            </div>

            <div class="charts-grid">
                <div>
                    <span class="chart-box-title">年間収支の推移</span>
                    <canvas id="cnvBar" width="360" height="240" role="img" aria-label="月ごとの収入と支出を示す棒グラフ"></canvas>
                </div>
            </div>

            <div class="legend">
                <div style="margin-left: 8px;"><span class="legend-box" style="background:#1F77B4;"></span>収入</div>
                <div><span class="legend-box" style="background:#D62728;"></span>支出</div>
            </div>
        </section>
    </main>

    <script src="./scripts/data.js"></script>
    <script src="./scripts/chart.js"></script>
    <script>
        document.getElementById('lbl-inc').innerText = "¥" + financeData.income.toLocaleString();
        const data = {
            expenseLabel: document.getElementById('lbl-exp'),
            balanceLabel: document.getElementById('lbl-bal'),
            income: financeData.income,
            expenses: financeData.expenses,
            historicalIncome: financeData.historicalIncome,
            historicalExpenses: financeData.historicalExpenses
        };
        const canvas = {
            bar: document.getElementById('cnvBar')
        };

        drawAll(data, canvas);

        let redrawFrame = 0;
        const scheduleRedraw = () => {
            if (!redrawFrame) {
                redrawFrame = requestAnimationFrame(() => {
                    redrawFrame = 0;

                    drawAll(data, canvas);
                });
            }
        };
        window.addEventListener('resize', scheduleRedraw);

        if ('ResizeObserver' in window) {
            const canvasObserver = new ResizeObserver(scheduleRedraw);
            Object.values(canvas).forEach(element => canvasObserver.observe(element));
        }

        let pixelRatioQuery;
        const watchPixelRatio = () => {
            if (pixelRatioQuery) {
                if (pixelRatioQuery.removeEventListener) {
                    pixelRatioQuery.removeEventListener('change', onPixelRatioChange);
                } else {
                    pixelRatioQuery.removeListener(onPixelRatioChange);
                }
            }

            pixelRatioQuery = window.matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`);

            if (pixelRatioQuery.addEventListener) {
                pixelRatioQuery.addEventListener('change', onPixelRatioChange);
            } else {
                pixelRatioQuery.addListener(onPixelRatioChange);
            }
        };
        const onPixelRatioChange = () => {
            watchPixelRatio();
            scheduleRedraw();
        };

        watchPixelRatio();
    </script>
</body>
</html>
