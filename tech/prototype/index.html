<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイホーム家計簿 動的ダッシュボード</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 0; }
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        h1 { margin: 0; font-size: 20px; color: #0f172a; }
        main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: block; }
        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; }
        @media (max-width: 1024px) { .grid-layout { grid-template-columns: 1fr; } }
        .panel { background-color: #ffffff; padding: 24px; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); }
        .panel-title { font-size: 16px; font-weight: 700; color: #475569; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; font-weight: 600; }
        .grid-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .card { background-color: #f8fafc; padding: 16px; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; }
        .card-title { font-size: 12px; color: #64748b; display: block; margin-bottom: 4px; }
        .card-val { font-size: 18px; font-weight: 800; }
        .chart-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 320px; }
        .bar-chart-area { display: flex; height: 260px; align-items: flex-end; justify-content: space-between; border-left: 2px solid #cbd5e1; border-bottom: 2px solid #cbd5e1; position: relative; width: 100%; box-sizing: border-box; }
        .bar-group { flex: 1; display: flex; align-items: flex-end; justify-content: center; height: 100%; gap: 2px; }
        .bar-inc { background-color: #1F77B4; width: 12px; transition: height 0.3s ease; }
        .bar-exp { background-color: #D62728; width: 12px; transition: height 0.3s ease; }
        .axis-x { display: flex; justify-content: space-between; width: 100%; padding-top: 8px; font-size: 11px; color: #64748b; font-weight: bold; text-align: center; }
        .legend { display: flex; justify-content: center; gap: 16px; margin-top: 16px; font-size: 12px; }
        .legend-box { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border-radius: 2px; vertical-align: middle; }
    </style>
</head>
<body>

    <header>
        <h1>📊 マイホーム家計簿</h1>
        <div style="font-size: 14px; font-weight: 600; color: #475569; background: #f1f5f9; padding: 6px 16px; border-radius: 20px; border: 1px solid #e2e8f0;">
            2026年 10月
        </div>
    </header>

    <main>
        <div class="grid-layout">
            <div class="panel">
                <h2 class="panel-title">今月の支出入力</h2>
                <div class="form-group"><label>住居費 (円)</label><input type="number" id="input-ju" value="100000" oninput="run()"></div>
                <div class="form-group"><label>食費 (円)</label><input type="number" id="input-shoku" value="100000" oninput="run()"></div>
                <div class="form-group"><label>光熱費 (円)</label><input type="number" id="input-kou" value="50000" oninput="run()"></div>
                <div class="form-group"><label>通信費 (円)</label><input type="number" id="input-tsu" value="20000" oninput="run()"></div>
                <div class="form-group"><label>娯楽・その他 (円)</label><input type="number" id="input-go" value="10000" oninput="run()"></div>
            </div>
            
            <div class="panel">
                <h2 class="panel-title">家計簿ダッシュボード</h2>
                <div class="grid-cards">
                    <div class="card"><span class="card-title">今月の収入</span><span class="card-val" style="color:#2563eb;">¥350,000</span></div>
                    <div class="card"><span class="card-title">今月の支出</span><span class="card-val" id="v-exp" style="color:#dc2626;">¥280,000</span></div>
                    <div class="card"><span class="card-title">今月の収支</span><span class="card-val" id="v-bal" style="color:#16a34a;">+¥70,000</span></div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                    <div class="text-center">
                        <span style="font-size: 13px; font-weight: bold; color: #64748b;">支出の内訳 (円グラフ)</span>
                        <div class="chart-container" id="pie-space" style="margin-top:16px;"></div>
                    </div>
                    <div class="text-center">
                        <span style="font-size: 13px; font-weight: bold; color: #64748b;">年間収支の推移</span>
                        <div class="chart-container" style="margin-top:16px;">
                            <div class="bar-chart-area" id="bar-space"></div>
                            <div class="axis-x">
                                <div>1月</div><div>2月</div><div>3月</div><div>4月</div><div>5月</div>
                                <div>6月</div><div>7月</div><div>8月</div><div>9月</div><div>10月</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="legend">
                    <div><span class="legend-box" style="background:#B4C6E7;"></span>住居</div>
                    <div><span class="legend-box" style="background:#F8CBAD;"></span>食費</div>
                    <div><span class="legend-box" style="background:#FFE699;"></span>娯楽</div>
                    <div><span class="legend-box" style="background:#8FAADC;"></span>光熱</div>
                    <div><span class="legend-box" style="background:#A9D18E;"></span>通信</div>
                    <div style="margin-left: 10px;"><span class="legend-box" style="background:#1F77B4;"></span>収入</div>
                    <div><span class="legend-box" style="background:#D62728;"></span>支出</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 文字列分割によってAIの配列消去エラーを完全に防止
        const incDataStr = "338-351-328-314-342-307-320-338-356-350";
        const expDataStr = "243-222-241-273-221-249-257-221-283-280";
        
        const incArr = incDataStr.split("-").map(Number);
        const expArr = expDataStr.split("-").map(Number);

        function run() {
            const v1 = Math.max(0, parseInt(document.getElementById('input-ju').value) || 0);
            const v2 = Math.max(0, parseInt(document.getElementById('input-shoku').value) || 0);
            const v3 = Math.max(0, parseInt(document.getElementById('input-kou').value) || 0);
            const v4 = Math.max(0, parseInt(document.getElementById('input-tsu').value) || 0);
            const v5 = Math.max(0, parseInt(document.getElementById('input-go').value) || 0);
            
            const total = v1 + v2 + v3 + v4 + v5;
            const balance = 350000 - total;
            
            document.getElementById('v-exp').innerText = "¥" + total.toLocaleString();
            document.getElementById('v-bal').innerText = (balance >= 0 ? "+" : "-") + "¥" + Math.abs(balance).toLocaleString();
            document.getElementById('v-bal').style.color = balance >= 0 ? "#16a34a" : "#dc2626";
            
            const div = total || 1;
            const segs = [v1/div*100, v2/div*100, v5/div*100, v3/div*100, v4/div*100];
            const cols = ['#B4C6E7', '#F8CBAD', '#FFE699', '#8FAADC', '#A9D18E'];
            
            let offset = 0;
            let svg = '<svg width="220" height="220" viewBox="0 0 32 32" style="transform: rotate(-90deg); border-radius: 50%;">';
            for (let i = 0; i < 5; i++) {
                if (segs[i] > 0) {
                    svg += '<circle cx="16" cy="16" r="15.915" fill="none" stroke="' + cols[i] + '" stroke-width="32" stroke-dasharray="' + segs[i] + ' 100" stroke-dashoffset="' + offset + '"></circle>';
                    offset -= segs[i];
                }
            }
            document.getElementById('pie-space').innerHTML = svg + '</svg>';
            
            // 10月の支出データをフォーム入力値で動的に書き換える
            expArr[9] = total / 1000;
            
            let bar = '<div style="position:absolute; left:0; right:0; bottom:25%; border-top:1px dashed #e2e8f0;"></div><div style="position:absolute; left:0; right:0; bottom:50%; border-top:1px dashed #e2e8f0;"></div><div style="position:absolute; left:0; right:0; bottom:75%; border-top:1px dashed #e2e8f0;"></div>';
            
            for (let m = 0; m < 10; m++) {
                bar += '<div class="bar-group"><div class="bar-inc" style="height:' + (incArr[m]/400*100) + '%;"></div><div class="bar-exp" style="height:' + (expArr[m]/400*100) + '%;"></div></div>';
            }
            document.getElementById('bar-space').innerHTML = bar;
        }
        window.onload = run;
    </script>
</body>
</html>
